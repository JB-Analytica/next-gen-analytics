chartConfig:
  config:
    eChartsConfig:
      legend:
        orient: horizontal
        show: true
    layout:
      flipAxes: false
      stack: true
      xField: fct_orders_order_date_month
      yField:
        - fct_orders_realised_revenue_eur
  type: cartesian
contentType: chart
description: Monthly totals, stacked by the country the order shipped to.
metricQuery:
  additionalMetrics: []
  customDimensions: []
  dimensions:
    - fct_orders_order_date_month
    - fct_orders_shipping_country_code
  exploreName: fct_orders
  filters:
    dimensions:
      and:
        - id: 2051305b-af24-5c41-bdd5-0f888f4d4dd1
          operator: inBetween
          target:
            fieldId: fct_orders_order_date
          values:
            - "2025-10-01"
            - "2026-09-30"
      id: b06a8aa8-2899-5979-9f86-3f7eb79f29b4
  limit: 500
  metricOverrides:
    fct_orders_realised_revenue_eur:
      formatOptions:
        compact: thousands
        currency: EUR
        round: 0
        separator: commaPeriod
        type: currency
  metrics:
    - fct_orders_realised_revenue_eur
  sorts:
    - descending: false
      fieldId: fct_orders_order_date_month
  tableCalculations: []
  timezone: project_timezone
name: Realised revenue by month and shipping country
pivotConfig:
  columns:
    - fct_orders_shipping_country_code
slug: revenue-by-month-and-country
spaceSlug: noordkust-kpis
tableConfig:
  columnOrder:
    - fct_orders_order_date_month
    - fct_orders_shipping_country_code
    - fct_orders_realised_revenue_eur
tableName: fct_orders
verification: null
version: 1
