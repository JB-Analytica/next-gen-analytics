version: 2

models:
  - name: metricflow_time_spine
    description: One row per calendar day. The daily time spine MetricFlow joins metrics onto.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Primary key. The calendar day.
        granularity: day
        data_tests: [unique, not_null]
