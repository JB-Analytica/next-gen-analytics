version: 2

sources:
  - name: noordkust
    description: >
      The Noordkust webshop's operational database (synthetic, generated by model2data) as landed
      by dlt into the raw_noordkust schema. Tables are merged on their primary key and carry
      dlt's _dlt_load_id / _dlt_id lineage columns. Money is integer minor units in the order's
      currency.
    schema: raw_noordkust
    loader: dlt
    config:
      # dlt stamps every row with _dlt_load_id: the epoch second of the load package, as a string
      # like "1788961669.673802". Casting it gives "when dlt loaded the row", so freshness tracks
      # the pipeline rather than the business dates, which are pinned in the synthetic data.
      # Rendered at parse time where project macros are not visible: it must be literal SQL.
      loaded_at_field: "to_timestamp(cast(split_part(_dlt_load_id, '.', 1) as bigint))"
      freshness:
        warn_after: { count: 1, period: day }
        error_after: { count: 3, period: day }
    tables:
      - name: customers
        description: One row per registered customer account.
      - name: products
        description: The catalogue, one row per sellable product. List prices are in euro cents.
      - name: orders
        description: One row per order, in the order's own currency, with status and timestamps.
      - name: order_items
        description: One row per product line on an order.
      - name: returns
        description: One row per return event; a return is always the whole order line.
